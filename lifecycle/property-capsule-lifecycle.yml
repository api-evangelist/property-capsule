summary: >-
  Property Capsule publishes no versioning policy, no deprecation policy, no SLA and no status
  page. What can be established is observational: the API host exposes two path-versioned
  major versions, and the public release notes announce two feature sunsets — one of which
  explicitly removed a surface "for public integration" — with no deprecation window, no
  Sunset/Deprecation headers, and no migration guidance.
