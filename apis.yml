apis:
- name: Property Capsule Developer API
  description: 'Property Capsule''s Developer API, announced live on 2020-06-18 in the company''s
    public release notes: "Our robust API is now live! Now your developers can access PropertyCapsule
    data outside of our platform, to power your website, internal applications, and much more."
    Access is granted by contacting support; there is no public reference and no machine-readable
    contract. The API host is live and fully authentication-gated — every path on
    api.propertycapsule.com returns the plain-text body "You must authenticate.", and
    /api exposes an Apache directory index listing two path-versioned majors, v1 and v2.
    Authentication is session-based (JSESSIONID). The product marketing page describes the surface
    as "REST, JSON, JSONP, XML and widgets" with custom Salesforce and Microsoft Dynamics
    integrations and two-way data feeds to JD Edwards, Oracle, MRI and Yardi.'
  humanURL: https://propertycapsule.com/details
