name: Property Capsule
description: 'Property Capsule (PropertyCapsule) is a retail and commercial real estate marketing
  automation and prospecting platform for landlords and brokers. It centralizes property, tenant,
  and availability data in one place and automatically publishes it as flyers, tourbooks, interactive
  site plans, aerials, demographics, and competition maps across web and iPad leasing apps. Founded
  around 2014, the company was acquired by VTS in October 2019 and its capabilities were folded into
  the VTS Market product. This profile was surfaced as a portfolio company of trinity-ventures.'
